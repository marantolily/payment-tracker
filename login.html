<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Family Loan Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/auth.js"></script>
</head>
<body class="login-page">
  <div class="container login-container">
    <div class="card login-card">
      <header>
        <h1>Family Loan Tracker</h1>
        <p>Enter your four-digit PIN to continue</p>
      </header>

      <div id="login-error" class="error-message" hidden>Incorrect PIN. Try again.</div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="password">PIN</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            inputmode="numeric"
            pattern="[0-9]{4}"
            maxlength="4"
            required
            autofocus
          >
        </div>
        <button type="submit" class="btn btn-primary btn-full">Enter</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById("login-form");
    const passwordInput = document.getElementById("password");
    const errorEl = document.getElementById("login-error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;

      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      try {
        if (await login(passwordInput.value)) {
          window.location.replace(getReturnPage());
          return;
        }
        errorEl.textContent = "Incorrect PIN.";
        passwordInput.value = "";
        passwordInput.focus();
      } catch (error) {
        errorEl.textContent = error.message;
      } finally {
        button.disabled = false;
      }
      errorEl.hidden = false;
    });
  </script>
</body>
</html>
